<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Subtitle Translator</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
        width: 280px;
        background: #0f172a;
        color: #f1f5f9;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
        font-weight: 600;
      }
      .sub {
        font-size: 12px;
        color: #94a3b8;
        margin-bottom: 14px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background: #1e293b;
        border-radius: 8px;
        margin-bottom: 12px;
      }
      .row label {
        font-size: 13px;
        font-weight: 500;
      }
      /* iOS-style switch */
      .switch {
        position: relative;
        display: inline-block;
        width: 38px;
        height: 22px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: #475569;
        transition: 0.2s;
        border-radius: 22px;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 16px;
        width: 16px;
        left: 3px;
        top: 3px;
        background: #fff;
        transition: 0.2s;
        border-radius: 50%;
      }
      input:checked + .slider {
        background: #22c55e;
      }
      input:checked + .slider:before {
        transform: translateX(16px);
      }
      .status {
        font-size: 12px;
        color: #cbd5e1;
        background: #1e293b;
        padding: 10px 12px;
        border-radius: 8px;
        line-height: 1.5;
      }
      .status b {
        color: #f1f5f9;
      }
      .footer {
        margin-top: 12px;
        font-size: 11px;
        color: #64748b;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Subtitle Translator</h1>
    <div class="sub">English → Arabic, real-time</div>

    <div class="row">
      <label for="toggle">Translation</label>
      <label class="switch">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="status">
      Detected video: <b id="hasVideo">—</b><br />
      Cached translations: <b id="cacheSize">—</b>
    </div>

    <div class="footer">If subtitles don't appear, reload the page.</div>

    <script src="popup.js"></script>
  </body>
</html>
